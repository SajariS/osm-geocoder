version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: osm_postgis
    environment:
      POSTGRES_DB: osm
      POSTGRES_USER: osmuser
      POSTGRES_PASSWORD: osmpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osmuser -d osm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: